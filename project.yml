name: QuotaArc
options:
  bundleIdPrefix: com.vaibhavkale
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "1.6.3"
    CURRENT_PROJECT_VERSION: "11"
    # Signed with a stable identity on purpose. The app reads Claude Code's
    # OAuth token out of the login keychain, and the keychain's ACL remembers
    # *which signed binary* was allowed. Ad-hoc or unsigned builds get a new
    # identity on every rebuild, so "Always Allow" would be forgotten each time
    # and the prompt would come back after every `make run`.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 6WFPL8B9FB
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Release:
      # One binary for Apple Silicon and Intel. Debug stays host-only so
      # `make run` on a contributor machine is not a fat build.
      ONLY_ACTIVE_ARCH: "NO"
      ARCHS: "arm64 x86_64"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  QuotaArc:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Quota Arc
        CFBundleDisplayName: Quota Arc
        LSMinimumSystemVersion: "15.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # --- Sparkle -------------------------------------------------------
        # `releases/latest/download/<name>` always resolves to the newest
        # GitHub Release's asset with that name, so pointing the feed here
        # means "check my GitHub releases" without standing up a separate
        # host: `make appcast` publishes appcast.xml as a release asset
        # alongside the dmg (see Makefile).
        #
        # Must stay reachable for as long as any copy is installed: the feed is
        # the only route by which a shipped build can ever be replaced.
        SUFeedURL: https://github.com/vaiibhavkale/Quota-Arc/releases/latest/download/appcast.xml
        # The public half of this fork's own EdDSA key in the login keychain
        # (generated fresh — the upstream project's key has no private half
        # here, so it could never have verified anything this fork signs).
        # Sparkle refuses any update not signed by its private half, so a
        # hijacked feed or a swapped download cannot install code. Losing the
        # private key means no existing install can ever be updated again —
        # back it up.
        SUPublicEDKey: Y33fJWT3C++vwd+qESsh50pLCCB9odUMEvMgCZq91sM=
        # Set explicitly so Sparkle never asks on first launch. Left unset, it
        # shows a "check for updates automatically?" prompt, which is exactly
        # the permission this is meant to avoid.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaibhavkale.quotaarc
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  QuotaArcTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: QuotaArc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaibhavkale.quotaarc.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  QuotaArc:
    build:
      targets:
        QuotaArc: all
        QuotaArcTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuotaArcTests
